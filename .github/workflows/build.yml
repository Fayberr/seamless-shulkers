name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: seamless-shulkers-jar
          path: build/libs/*.jar
      # Same code with the [SS-DEBUG] trace switched on, for diagnosing in-game reports.
      - run: gradle --no-daemon jar -PdebugBuild
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: seamless-shulkers-debug-jar
          path: build/libs/*-debug.jar
