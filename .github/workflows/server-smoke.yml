name: Dedicated Server Smoke
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/server-smoke.yml'
  workflow_dispatch:
jobs:
  fabric-server:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Launch Minecraft 26.3 dedicated server
        run: |
          set -euo pipefail
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          set +e
          timeout 160s gradle --no-daemon runServer --args nogui > /tmp/server.log 2>&1
          status=$?
          set -e
          cat /tmp/server.log
          if grep -q "Done (" /tmp/server.log; then
            echo "Dedicated server started with Seamless Shulkers."
          else
            echo "Server did not reach ready state (exit status: $status)."
            exit 1
          fi
