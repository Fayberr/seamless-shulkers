name: Client Game Test
# Manual only: the test runs locally (xvfb-run gradle runClientGameTest) and is slow and
# expensive on hosted runners, so it must not burn Actions minutes on every push.
on:
  workflow_dispatch:
jobs:
  client-gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sbt: [false, true]
    name: client game test (Shulker Box Tooltip ${{ matrix.sbt && 'installed' || 'absent' }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers libvulkan1
      - name: Run client game test
        shell: bash
        run: |
          set -o pipefail
          extra=""
          if [ "${{ matrix.sbt }}" = "true" ]; then extra="-PwithSbt"; fi
          # Minecraft 26.3 falls back to Vulkan on Mesa lavapipe when no GLX visual matches.
          # A client without a usable backend never exits, so cap the run.
          timeout 1200 xvfb-run -a -s "-screen 0 1920x1080x24" gradle --no-daemon runClientGameTest $extra 2>&1 | tee /tmp/client.log
          grep -q "all preview scenarios passed" /tmp/client.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-gametest-screenshots-${{ matrix.sbt && 'sbt' || 'plain' }}
          path: build/run/clientGameTest/screenshots
          if-no-files-found: ignore
