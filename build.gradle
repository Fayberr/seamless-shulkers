plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archive_base_name }
repositories {
    mavenCentral()
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = 'https://maven.fabricmc.net/' }
    exclusiveContent {
        forRepository { maven { url = "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }
}
loom {
    splitEnvironmentSourceSets()
    mods {
        "seamlessshulkers" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "seamlessshulkers-test"
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly "me.shedaniel.cloth:cloth-config-fabric:26.3.158"
    compileOnly "com.terraformersmc:modmenu:21.0.0-beta.1"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // Opt-in compatibility run: `gradle runClientGameTest -PwithSbt` adds Shulker Box Tooltip to the
    // test client only. It is never bundled, declared or needed at runtime.
    if (project.hasProperty('withSbt')) {
        localRuntime "maven.modrinth:shulkerboxtooltip:${project.findProperty('sbt_version') ?: '5.4.2+26.3-fabric'}"
    }
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

// Regressions that can be verified without a graphics context.
tasks.withType(Test).configureEach { useJUnitPlatform() }
